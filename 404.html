<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Sayfa bulunamadı</title><style>
:root{--bg:#0f0d1c;--card:#1b1830;--line:#2c2850;--tx:#e9e7f5;--mut:#a9a4c7;--ac:#8b7bff;--ok:#3ddc97}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--ac)}header,main,footer{max-width:860px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;padding-top:18px;padding-bottom:18px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px}
header .brand{font-weight:800;color:var(--tx);text-decoration:none;font-size:18px}header nav a{margin-left:14px;font-size:14px;text-decoration:none;color:var(--mut)}
header nav a:hover{color:var(--tx)}h1{font-size:30px;line-height:1.25;margin:28px 0 8px}h2{font-size:22px;margin:34px 0 10px}h3{font-size:18px;margin:22px 0 6px}
.meta{color:var(--mut);font-size:14px}.lead{font-size:18px;color:#d6d3ea}
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px}th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{background:var(--card)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:18px 0}
.cta{display:inline-block;background:var(--ac);color:#fff;text-decoration:none;padding:10px 16px;border-radius:10px;font-weight:700;margin:6px 6px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.grid a{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:var(--tx)}
.grid a b{display:block;color:var(--ac);margin-bottom:4px}.grid a span{color:var(--mut);font-size:14px}
ol li,ul li{margin:6px 0}.chk li{list-style:none;margin-left:-22px}.chk li:before{content:"☐ ";color:var(--ok)}
footer{border-top:1px solid var(--line);margin-top:40px;padding-top:16px;padding-bottom:30px;color:var(--mut);font-size:14px}
</style></head><body><main><h1>Sayfa bulunamadı</h1><p><a href="/">Dokümantasyon ana sayfasına dön</a> · <a href="https://nexusforgeko.com/">nexusforgeko.com</a></p></main></body></html>
